stages:
  - build
  - archive-package

.artifacts_template:
  artifacts:
    name: wheels
    paths:
      - driver/dist/cantact-*.whl
    expire_in: 15 minutes

build-linux:
  stage: build
  image: $PYIMAGE
  script:
    - apt update
    - apt install -y gcc curl libusb-1.0-0-dev pkg-config
    - curl -o rust.sh --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
    - sh ./rust.sh -y
    - source "$HOME/.cargo/env"
    - rustup install nightly
    - pip install -r driver/requirements.txt
    - pip install build
    - rustup override set nightly
    - cd driver
    - python -m build --wheel --outdir dist
  extends: .artifacts_template
  tags:
    - cloud
  parallel:
    matrix:
      - PYIMAGE:
          - "python:3.9-slim-bullseye"
          - "python:3.10-slim-bullseye"
          - "python:3.11-slim-bullseye"
          - "python:3.12-slim-bullseye"

build-windows:
  stage: build
  image: "windows-base-image-with-python"
  parallel:
    matrix:
       - PYTHON_VERSION:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
  script:
    - pyenv global $PYTHON_VERSION
    - python --version
    - pip install -r driver/requirements.txt
    - pip install build
    - curl https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -o rustup-init.exe
    - ./rustup-init.exe -y
    - git clone https://github.com/Microsoft/vcpkg.git
    - cd vcpkg
    - .\bootstrap-vcpkg.bat
    - .\vcpkg integrate install
    - .\vcpkg install libusb:x64-windows-static-md
    - rustup install nightly
    - cd ..
    - cd driver
    - rustup override set nightly
    - python -m build --wheel --outdir dist
  extends: .artifacts_template
  tags:
    - windows-shell

package:
  tags:
    - cloud
  stage: archive-package
  image: debian:bullseye-slim
  script:
    - echo "Packaging wheel files"
  needs:
    - build-linux
    - build-windows
  extends: .artifacts_template
  artifacts:
    expire_in: never
