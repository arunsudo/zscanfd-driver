stages:
  - clippy-check
  - build-libs
  - archive-libs-package
  - build-dumptool-windows
  - archive-dumptool-windows
  - build-python-libs
  - archive-python-libs

.artifacts_template_debug_libs_windows:
  artifacts:
    name: debug_libs
    paths:
      - driver/src/c/zs_canfd.h
      - target/debug/zscanfd.dll
      - target/debug/zscanfd.dll.lib
      - target/debug/zscanfd.dll.exp
      - target/debug/zscanfd.pdb
      - target/debug/libzscanfd.rlib
    expire_in: 15 minutes

.artifacts_template_release_libs_windows:
  artifacts:
    name: release_libs
    paths:
      - driver/src/c/zs_canfd.h
      - target/release/zscanfd.dll
      - target/release/zscanfd.dll.lib
      - target/release/libzscanfd.rlib
    expire_in: 15 minutes

.artifacts_template_for_python:
  artifacts:
    name: wheels
    paths:
      - driver/dist/zscanfd-*.whl
    expire_in: 15 minutes

.artifacts_template_dumptool_windows:
  artifacts:
    name: executable
    paths:
      - target/release/can.exe
    expire_in: 15 minutes

clippy:
  stage: clippy-check
  tags:
    - cloud
  image: rust:slim-bullseye
  script:
    - apt update && apt install -y libusb-1.0-0-dev pkg-config
    - rustup component add clippy
    - cargo clippy --all-targets --all-features -- -D warnings

build-libs-debug-windows:
  stage: build-libs
  tags:
    - windows-shell
  image: "windows-base-image-with-python"
  script:
    - curl https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -o rustup-init.exe
    - ./rustup-init.exe -y
    - git clone https://github.com/Microsoft/vcpkg.git
    - cd vcpkg
    - .\bootstrap-vcpkg.bat
    - .\vcpkg integrate install
    - .\vcpkg install libusb:x64-windows-static-md
    - rustup install nightly
    - cd ..
    - cd driver
    - cargo build
  extends:
    - .artifacts_template_debug_libs_windows

build-libs-release-windows:
  stage: build-libs
  tags:
    - windows-shell
  image: "windows-base-image-with-python"
  script:
    - curl https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -o rustup-init.exe
    - ./rustup-init.exe -y
    - git clone https://github.com/Microsoft/vcpkg.git
    - cd vcpkg
    - .\bootstrap-vcpkg.bat
    - .\vcpkg integrate install
    - .\vcpkg install libusb:x64-windows-static-md
    - rustup install nightly
    - cd ..
    - cd driver
    - cargo build --release
  extends:
    - .artifacts_template_release_libs_windows

package-libs:
  tags:
    - cloud
  stage: archive-libs-package
  image: debian:bullseye-slim
  script:
    - echo "Packaging lib files (*.dll, *.dll.lib, *.rlib, etc...)"
  extends:
    - .artifacts_template_debug_libs_windows
    - .artifacts_template_release_libs_windows
  artifacts:
    expire_in: never

build-windows-dumptool:
  stage: build-dumptool-windows
  tags:
    - windows-shell
  script:
    - curl https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -o rustup-init.exe
    - ./rustup-init.exe -y
    - git clone https://github.com/Microsoft/vcpkg.git
    - cd vcpkg
    - .\bootstrap-vcpkg.bat
    - .\vcpkg integrate install
    - .\vcpkg install libusb:x64-windows-static-md
    - cargo build --release
  extends:
    - .artifacts_template_dumptool_windows

package-dumptool-windows:
  tags:
    - cloud
  stage: archive-dumptool-windows
  needs:
    - build-windows-dumptool
  script:
    - echo "Packaging can.exe used to cli can dump in windows"
  extends:
    - .artifacts_template_dumptool_windows
  artifacts:
    expire_in: never

build-python-libs-linux:
  stage: build-python-libs
  tags:
    - cloud
  parallel:
    matrix:
      - PYTHON_VERSION:
        - "3.9"
        - "3.10"
        - "3.11"
        - "3.12"
  image: navinkumarj/pyenv-py3-9-to-py3-13:rust_slim-bullseye
  script:
    - apt update && apt install -y libusb-1.0-0-dev pkg-config
    - rustup install nightly
    - pyenv global $PYTHON_VERSION
    - python --version
    - pip install -r driver/requirements.txt
    - pip install build
    - cd driver
    - rustup override set nightly
    - python -m build --wheel --outdir dist
  extends:
    - .artifacts_template_for_python

build-python-libs-windows:
  stage: build-python-libs
  tags:
    - windows-shell
  parallel:
    matrix:
      - PYTHON_VERSION:
        - "3.9"
        - "3.10"
        - "3.11"
        - "3.12"
  script:
    - curl https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -o rustup-init.exe
    - ./rustup-init.exe -y
    - rustup install nightly
    - git clone https://github.com/Microsoft/vcpkg.git
    - cd vcpkg
    - .\bootstrap-vcpkg.bat
    - .\vcpkg integrate install
    - .\vcpkg install libusb:x64-windows-static-md
    - cd ..
    - pyenv install $PYTHON_VERSION
    - pyenv global $PYTHON_VERSION
    - python --version
    - pip install -r driver/requirements.txt
    - pip install build
    - cd driver
    - rustup override set nightly
    - python -m build --wheel --outdir dist
  extends:
    - .artifacts_template_for_python

package-python:
  tags:
    - cloud
  stage: archive-python-libs
  image: debian:bullseye-slim
  script:
    - echo "Packaging wheel files"
  needs:
    - build-python-libs-linux
    - build-python-libs-windows
  extends:
    - .artifacts_template_for_python
  artifacts:
    expire_in: never
